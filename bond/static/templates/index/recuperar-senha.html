{% extends "dashboard/header.html" %}

{% block content  %}

<hr class="opacity-4">

<main class="main mt-5">
    <nav aria-label="breadcrumb" class="breadcrumb-nav">
        <div class="container">
            <ol class="breadcrumb">
                <li class="breadcrumb-item"><a href="/"><i class="icon-home"></i></a></li>
                <li class="breadcrumb-item active" aria-current="page">recuperar-senha</li>
            </ol>
        </div>
    </nav>

  

    <div class="container pb-5">
        <div class="heading mb-4">
        

            <h2 class="title">Recuperação de senha</h2>
            <p>Por favor, nos informe o seu e-mail e enviaremos um link para a recuperação da senha.</p>
        </div><!-- End .heading -->
              <h3 class="text-3 text-danger"  > {{error_message}} </h3>
        <form action="{%url 'rec_senha' %}" method="POST">

            {% csrf_token %}
            <div class="form-group required-field">
                <label for="reset-email">E-mail da conta</label>
                <input type="email"  class="form-control text-3" id="email" name="email" required>
            </div><!-- End .form-group -->

            <div class="form-footer">
                <button type="submit" class="btn btn-primary">Enviar token de recuperação</button>
            </div><!-- End .form-footer -->
        </form>
    </div><!-- End .container -->
</main><!-- End .main -->

{% endblock %}
