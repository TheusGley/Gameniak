{% extends "index/header.html" %}

{% block content %}

	<main class="main">
		
		
		
		<div class="category-banner-container bg-gray">
			<div class="category-banner banner text-uppercase" style="background: no-repeat 60%/cover url('/res/UserDashboard/assets/giftbg3.png');">
				<div class="container position-relative">
					<div class="row">
						<div class="pl-lg-5 pb-5 pb-md-0 col-md-5 col-xl-4 col-lg-4 offset-1">
							<h3 class="ml-lg-5 mb-2 ls-10 text-white">BAIXE O <br>PICPAY</h3>
							<a href="#" class="ml-lg-5 btn btn-dark btn-black ls-10 ">BAIXAR AGORA</a>
						</div>
						<div class="pl-lg-5 col-md-4 offset-md-0 offset-1 pt-4">
							<div class="coupon-sale-content">
								<h4 class="m-b-2 coupon-sale-text bg-white ls-10 text-transform-none">RECEBA</h4>
								<h5 class="mb-2 coupon-sale-text d-block ls-10 p-0"><i class="ls-0"></i><b class="text-dark">R$10,00</b> </h5>
								<h5 class="m-b-2 coupon-sale-text bg-white ls-10 text-transform-none">USANDO NOSSO CÓDIGO</h4>
							</div>
						</div>
					</div>
				</div>
			</div>
		</div>






			<div class="container">

				<nav aria-label="breadcrumb" class="breadcrumb-nav">
					<ol class="breadcrumb">
						<li class="breadcrumb-item"><a href="/"><i class="icon-home"></i></a></li>
						<li class="breadcrumb-item"><a href="/">Home</a></li>
						<li class="breadcrumb-item active" aria-current="page">Produtos</li>
					</ol>
				</nav>

				<nav class="toolbox">
					<div class="toolbox-left">
						<div class="toolbox-item toolbox-sort">
							<label>Filtrar Por:</label>

							<div class="select-custom">
								<select name="orderby" class="form-control">
									<option value="menu_order" selected="selected">Pesquisa Padrão</option>
						
								</select>
							</div><!-- End .select-custom -->

							
						</div><!-- End .toolbox-item -->
					</div><!-- End .toolbox-left -->

					<div class="toolbox-right">
						<div class="toolbox-item toolbox-show">
							<label>Mostrar:</label>

							<div class="select-custom">
								<select name="count" class="form-control">
									<option value="12">12</option>
									<option value="24">24</option>
									<option value="36">36</option>
								</select>
							</div><!-- End .select-custom -->
						</div><!-- End .toolbox-item -->

						<div class="toolbox-item layout-modes">
							<a href="/lista-produtos" class="layout-btn btn-grid active" title="Grid">
								<i class="icon-mode-grid"></i>
							</a>
					
						</div><!-- End .layout-modes -->
					</div><!-- End .toolbox-right -->
				</nav>

				<div class="row mx-0 divide-line up-effect">
				  
					{%for  a in anuncios %}			
						<div class="col-6 col-sm-4 col-md-3 product-default inner-quickview inner-icon">
							<figure>

								<a href='{% url "produto" a.id %}' >
									<img src='{{a.imagem.url}}' class="img-product-alta" alt="product">
								</a>

								<div class="label-group">
									{% comment %} <div class="product-label label-hot">EM ALTA</div>
									<div class="product-label label-sale">-20%</div> {% endcomment %}
								</div>
								<div class="btn-icon-group">
										<button class="btn-icon btn-add-cart" data-toggle="modal" data-target="#addCartModal{{a.id}}"><i class="icon-shopping-cart"></i></button></a>
								</div>
								<a href='{% url "produto" a.id %}' class="btn-quickview" title="Quick View">VISUALIZAR</a> 							</figure>
								<div class="product-details">
									<div class="category-wrap">
										<div class="category-list">
											<a href='{% url "categoria" a.categoria %}' class="product-category"> 
												{{a.categoria}}</a>
										</div>
										<a href="#" class="btn-icon-wish"><i class="icon-heart"></i></a>
									</div>
									<h2 class="product-title">
										<a href='{% url "produto" a.id %}"}'>{{a.nome}}</a>
									</h2>
									<div class="ratings-container">
										<div class="product-ratings">
											<span class="ratings" style="width:100%"></span><!-- End .ratings -->
											<span class="tooltiptext tooltip-top"></span>
										</div><!-- End .product-ratings -->
									</div><!-- End .product-container -->
									<div class="price-box">
										<!-- <span class="old-price">$90.00</span> -->
										<span class="product-price">R${{a.valor}}</span>
									</div><!-- End .price-box -->
								</div><!-- End .product-details -->
						</div><!-- End .product-default -->

							<!-- Add Cart Modal -->
							<div class="modal fade" id="addCartModal{{a.id}}" tabindex="-1" role="dialog" aria-labelledby="addCartModal{{a.id}}" aria-hidden="true">
								<div class="modal-dialog" role="document">
								<div class="modal-content">
									<div class="modal-body add-cart-box text-center">
									<label>Você quer adicionar esse produto no seu  <br>carrinho?</label>
									<h4 >{{a.nome}}</h4>
									<img src="#" id="productImage" width="100" height="100" alt="adding cart image">
									<div class="btn-actions">
										<a href="{% url "addCarrinho"  a.id %}"><button class="btn-primary">Adicionar</button></a>
										<a href="#"><button class="btn-primary" data-dismiss="modal">Fechar janela</button></a>
									</div>
									</div>
								</div>
								</div>
							</div>
					{%endfor%}

				</div><!-- End .row -->

				<nav class="toolbox toolbox-pagination border-0">
					<div class="toolbox-item toolbox-show">
						<label>Mostrar:</label>

						<div class="select-custom">
							<select name="count" class="form-control">
								<option value="12">12</option>
								<option value="24">24</option>
								<option value="36">36</option>
							</select>
						</div><!-- End .select-custom -->
					</div><!-- End .toolbox-item -->

					<ul class="pagination toolbox-item">
						<li class="page-item disabled">
							<a class="page-link page-link-btn" href="#"><i class="icon-angle-left"></i></a>
						</li>
						<li class="page-item active">
							<a class="page-link" href="#">1 <span class="sr-only">(current)</span></a>
						</li>
						<li class="page-item"><a class="page-link" href="#">2</a></li>
						<li class="page-item"><a class="page-link" href="#">3</a></li>
						<li class="page-item"><a class="page-link" href="#">4</a></li>
						<li class="page-item"><a class="page-link" href="#">5</a></li>
						<li class="page-item"><span class="page-link">...</span></li>
						<li class="page-item">
							<a class="page-link page-link-btn" href="#"><i class="icon-angle-right"></i></a>
						</li>
					</ul>
				</nav>
			</div><!-- End .container -->

			<div class="mb-3"></div><!-- margin -->
		</main><!-- End .main -->

{% endblock  %}
